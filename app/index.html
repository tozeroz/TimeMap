<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <title>Campus</title>
    <!--
      ⚠️ 本文件会**原样下发到浏览器**（包括注释），所以这里只留必要的短说明；
      完整的设计理由写在 docs/ 与提交信息里，不要往生产 HTML 里塞内部推理。
      —— 这条本身就是 WO#25 的一次修正：最初把大段内部注释写在这里，
         让 index.html 从 519 字节涨到 2376 字节，且把内部判断暴露给了每个访客。
    -->
    <script>
      // 网页端放开缩放（原生壳内保持 user-scalable=no）。
      // 细节见 docs/WEB-FRONTEND.md「与原生端的差异」。
      ;(function () {
        var cap = window.Capacitor
        var isNative = typeof cap?.isNativePlatform === 'function' && cap.isNativePlatform() === true
        if (isNative) return
        var m = document.querySelector('meta[name="viewport"]')
        if (m) m.setAttribute('content', 'width=device-width, initial-scale=1.0, viewport-fit=cover')
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
