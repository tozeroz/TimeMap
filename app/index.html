<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="./timemap-logo.png" />
    <link rel="apple-touch-icon" href="./timemap-logo.png" />
    <title>TimeMap</title>
    <script>
      /*
        网页端放开缩放；原生壳内保持 user-scalable=no。
        判别方式用 location.hostname：原生壳的页面源是 https://localhost
        （Capacitor androidScheme 的既定行为），网页端是我们自己的域名/IP。
        ⚠️ 刻意**不依赖 window.Capacitor 是否已注入** —— 原生桥的脚本注入时机
           不由我们控制，若它还没到就判断，会把原生 App 误判成网页端、
           从而把 App 的缩放也放开（那是原生侧的行为回归）。
        注：本文件会原样下发到浏览器，注释保持简短；完整理由见 docs/ 与提交信息。
      */
      ;(function () {
        var isNativeShell =
          location.hostname === 'localhost' ||
          (typeof window.Capacitor?.isNativePlatform === 'function' && window.Capacitor.isNativePlatform() === true)
        if (isNativeShell) return
        var m = document.querySelector('meta[name="viewport"]')
        if (m) m.setAttribute('content', 'width=device-width, initial-scale=1.0, viewport-fit=cover')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
