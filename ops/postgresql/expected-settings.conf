# M0 冻结参数（据 docs/review-log/02 与 PLAN.md 第五节）
# 这是 expected state：服务器 /etc/postgresql/18/main/conf.d-campus-freeze.conf 应与本文件一致。
# 通过 ops/apply.sh 下发。

# 只监听本机：数据库绝不能对公网暴露
listen_addresses = 'localhost'

# 连接数：低内存环境下，减少连接数是降低内存风险的主要手段
max_connections = 15

# 内存：优先「不 OOM」的 bootstrap 参数，不是性能最优
shared_buffers = 64MB
effective_cache_size = 192MB
work_mem = 1MB
maintenance_work_mem = 16MB
autovacuum_work_mem = 16MB

# 并行全关：parallel worker 是独立进程，会放大内存/CPU 消耗
max_parallel_workers_per_gather = 0
max_parallel_workers = 0
max_parallel_maintenance_workers = 0

# 保守的后台活动
autovacuum_max_workers = 2
