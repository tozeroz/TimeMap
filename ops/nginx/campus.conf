# Campus 站点配置（唯一真源 = 本仓库；服务器 /etc/nginx/sites-available/campus.conf 应与之一致）
#
# 两个 server 块共用同一份 location（snippets/campus-locations.inc），
# 目的：80 与 443 的行为必须完全一致，不能一个改了另一个忘改。
#
# 为什么 M2 起同时保留 80：
#   M0 的外部可达性断言就是「http://<IP>/health == 200」（check-host 三节点），
#   直接把 80 改跳转会把那条历史验收证据弄失效。
#   过渡期双栈并存；是否 301 到 https 留到 M6 正式域名/公共 CA 落地时再定。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.148.156.146 _;

    include /etc/nginx/snippets/campus-locations.inc;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 8.148.156.146 _;

    # 临时私有 CA 签发的叶子证书；SAN 必须是 IP:8.148.156.146（iPAddress 类型），
    # 否则 HTTPS 的主机身份校验会失败 —— 信任链与身份校验是两道独立检查。
    # 证书由 ops/tls/gen-certs.sh 生成，私钥只留在服务器。
    ssl_certificate     /etc/ssl/campus/server.crt;
    ssl_certificate_key /etc/ssl/campus/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    include /etc/nginx/snippets/campus-locations.inc;
}
