# Campus 站点配置（唯一真源 = 本仓库；服务器 /etc/nginx/sites-available/campus.conf 应与之一致）
#
# 两个 server 块共用同一份 location（snippets/campus-locations.inc），
# 目的：80 与 443 的行为必须完全一致，不能一个改了另一个忘改。
#
# 为什么 M2 起同时保留 80：
#   M0 的外部可达性断言就是「http://<IP>/health == 200」（check-host 三节点），
#   直接把 80 改跳转会把那条历史验收证据弄失效。
#   过渡期双栈并存；是否 301 到 https 留到 M6 正式域名/公共 CA 落地时再定。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.148.156.146 _;

    include /etc/nginx/snippets/campus-locations.inc;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 8.148.156.146 _;

    # ⭐ 证书：**Let's Encrypt 签发的 IP 地址证书**（公共信任）
    #
    # ════════════════════════════════════════════════════════════════════════
    # 2026-09-23 变更：从「自建私有 CA 自签」换成「LE 公共信任」
    # ════════════════════════════════════════════════════════════════════════
    # 为什么必须换：原本用 ops/tls/gen-certs.sh 生成的私有 CA 自签叶子证书。
    #   · **App（APK）能用** —— 因为 APK 的 network_security_config 里内置了那个 CA
    #   · **浏览器不能用** —— 浏览器不认私有 CA（实测 curl 报
    #     "unable to get local issuer certificate"）⇒ 网页端一打开就报证书错误
    # ⇒ 要支持网页端（尤其 iOS Safari），必须换成**公共信任**的证书。
    #
    # 为什么可以不用域名：Let's Encrypt 自 2026-01-15 起**正式支持给纯 IP 签发证书**
    #   （必须用 shortlived profile，有效期约 6 天；验证只能走 http-01 / tls-alpn-01，
    #   因为 IP 不涉及 DNS）。⇒ 免域名、免备案（备案是域名的事）。
    #
    # ⚠️ 有效期只有 ~6 天 ⇒ **自动续期是硬要求**，漏一次全站就报证书错误。
    #    续期由 systemd timer 驱动（见 ops/systemd/），并通过 --deploy-hook reload nginx。
    # ⚠️ 不要删 /etc/ssl/campus/ 那套私有 CA：留着可回滚，且 APK 里内置的就是它。
    # ⚠️ certbot 的 nginx 插件**尚不支持 IP 证书**，所以这里必须手写路径
    #    （官方文档明确："Certbot only supports getting IP address certificates,
    #      not yet installing them in your web server"）。
    ssl_certificate     /etc/letsencrypt/live/8.148.156.146/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.148.156.146/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    include /etc/nginx/snippets/campus-locations.inc;
}
