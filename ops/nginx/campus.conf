# M0 骨架：/health 由 Nginx 直接返回；/api 反代到尚未启动的后端（M1 才启用）。
# 这是 expected state：服务器 /etc/nginx/sites-available/campus.conf 应与本文件一致。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.148.156.146 _;

    # 健康检查：M0 的 /health 由 Nginx 自己回答，不经过后端
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"campus-gateway","stage":"M0"}';
    }

    # API 反代骨架：M1 起由 Fastify 提供真实实现
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # M0 没有任何静态站点与业务路由，其它一律 404，避免误暴露
    location / { return 404; }
}
